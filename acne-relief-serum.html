<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acne Relief Serum</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #f0f7f4;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    background: linear-gradient(135deg, #e8f4f8 0%, #f0f9f4 40%, #eaf6f0 70%, #dff0f8 100%);
    overflow: hidden;
  }

  /* ── CSS Keyframes ── */
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translate(-50%, calc(-50% + 50px)); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(24px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  @keyframes chipLeft {
    from { opacity: 0; transform: translateX(-28px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes chipRight {
    from { opacity: 0; transform: translateX(28px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes expandWidth {
    from { width: 0; }
    to   { width: 860px; }
  }
  @keyframes benefitUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%, 100% { transform: translate(-50%, -50%); }
    50%       { transform: translate(-50%, calc(-50% - 10px)); }
  }

  /* ── Background decorative circles ── */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    animation: fadeIn 1.8s ease-out forwards;
  }
  .bg-circle-1 {
    width: 700px; height: 700px;
    top: -180px; right: -180px;
    background: radial-gradient(circle, rgba(176,224,210,0.35) 0%, rgba(176,224,210,0) 70%);
    animation-delay: 0s;
  }
  .bg-circle-2 {
    width: 500px; height: 500px;
    bottom: -120px; left: -120px;
    background: radial-gradient(circle, rgba(173,216,230,0.3) 0%, rgba(173,216,230,0) 70%);
    animation-delay: 0.2s;
    opacity: 0; animation-fill-mode: forwards;
  }
  .bg-circle-3 {
    width: 300px; height: 300px;
    top: 200px; left: 60px;
    background: radial-gradient(circle, rgba(144,238,200,0.2) 0%, rgba(144,238,200,0) 70%);
    animation-delay: 0.4s;
    opacity: 0; animation-fill-mode: forwards;
  }

  /* ── Thin grid lines ── */
  .grid-lines {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(100,180,160,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(100,180,160,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0;
    animation: fadeIn 2s 0.3s ease-out forwards;
  }

  /* ── Bottle wrapper ── */
  .bottle-wrap {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    opacity: 0;
    animation:
      riseIn 1.4s 0.8s cubic-bezier(0.16,1,0.3,1) forwards,
      float   3s  2.2s ease-in-out infinite;
  }

  /* ── SVG bottle ── */
  .bottle-svg {
    width: 220px;
    filter: drop-shadow(0 30px 60px rgba(80,160,140,0.25)) drop-shadow(0 8px 20px rgba(0,0,0,0.12));
  }

  /* ── Ingredient chips ── */
  .ingredient {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(100,200,170,0.3);
    border-radius: 50px;
    padding: 10px 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 24px rgba(80,160,140,0.12);
    opacity: 0;
    white-space: nowrap;
  }
  .ingredient-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .ingredient span {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #2a6654;
    text-transform: uppercase;
  }

  .ing-tea   { top: 180px; left: 80px;  animation: chipLeft  0.8s 1.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .ing-sal   { top: 490px; left: 60px;  animation: chipLeft  0.8s 1.9s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .ing-aloe  { top: 335px; right: 75px; animation: chipRight 0.8s 2.1s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  .ing-tea   .ingredient-icon { background: #d4f0e4; }
  .ing-sal   .ingredient-icon { background: #d4e8f5; }
  .ing-aloe  .ingredient-icon { background: #dff5ea; }

  /* ── Brand / headline ── */
  .brand-name {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.35em;
    font-weight: 500;
    color: #5aaa8a;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s 0.6s ease-out forwards;
    white-space: nowrap;
  }

  .headline {
    position: absolute;
    bottom: 260px;
    left: 50%;
    transform: translateX(-50%) translateY(24px);
    text-align: center;
    opacity: 0;
    width: 700px;
    animation: slideUp 1s 1.8s ease-out forwards;
  }
  .headline h1 {
    font-size: 54px;
    font-weight: 200;
    letter-spacing: 0.12em;
    color: #1a3d30;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .headline h1 strong {
    font-weight: 700;
    color: #1a5c44;
  }
  .headline-rule {
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, #5aaa8a, transparent);
    margin: 18px auto;
  }

  /* ── Benefits row ── */
  .benefits {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0;
    width: 860px;
  }
  .benefit {
    flex: 1;
    text-align: center;
    padding: 22px 20px;
    border-left: 1px solid rgba(90,170,138,0.2);
    opacity: 0;
  }
  .benefit:first-child { border-left: none; }
  .benefit-num {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #5aaa8a;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .benefit-text {
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: #1a4035;
    text-transform: uppercase;
  }

  #b1 { animation: benefitUp 0.6s 2.4s ease-out forwards; }
  #b2 { animation: benefitUp 0.6s 2.6s ease-out forwards; }
  #b3 { animation: benefitUp 0.6s 2.8s ease-out forwards; }

  /* ── Bottom rule ── */
  .bottom-rule {
    position: absolute;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(90,170,138,0.4), transparent);
    animation: expandWidth 1s 2.2s ease-in-out forwards;
  }

  /* ── Floating dots ── */
  .dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(90,170,138,0.2);
    opacity: 0;
    animation: fadeIn 1s ease-out forwards;
  }
  .dot:nth-child(1) { animation-delay: 0.5s; }
  .dot:nth-child(2) { animation-delay: 0.65s; }
  .dot:nth-child(3) { animation-delay: 0.8s; }
  .dot:nth-child(4) { animation-delay: 0.95s; }
  .dot:nth-child(5) { animation-delay: 1.1s; }
</style>
</head>
<body>
<div class="canvas" id="canvas">

  <!-- Background -->
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-circle bg-circle-3"></div>
  <div class="grid-lines"></div>

  <!-- Floating dots -->
  <div class="dot" style="width:8px;height:8px;top:140px;right:240px;"></div>
  <div class="dot" style="width:5px;height:5px;top:600px;left:200px;"></div>
  <div class="dot" style="width:6px;height:6px;bottom:200px;right:180px;"></div>
  <div class="dot" style="width:4px;height:4px;top:400px;left:140px;"></div>
  <div class="dot" style="width:10px;height:10px;top:750px;right:120px;"></div>

  <!-- Brand name -->
  <div class="brand-name">Derma Luxe Laboratories</div>

  <!-- Serum Bottle (SVG) -->
  <div class="bottle-wrap" id="bottle">
    <svg class="bottle-svg" viewBox="0 0 220 520" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#c8e8e0" stop-opacity="0.95"/>
          <stop offset="30%"  stop-color="#f4fcfa" stop-opacity="1"/>
          <stop offset="65%"  stop-color="#e8f6f2" stop-opacity="1"/>
          <stop offset="100%" stop-color="#b8d8d2" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#d4ece8"/>
          <stop offset="50%"  stop-color="#f8fffe"/>
          <stop offset="100%" stop-color="#a8ccc8"/>
        </linearGradient>
        <linearGradient id="dropperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#a0c8c4"/>
          <stop offset="50%"  stop-color="#e8f8f4"/>
          <stop offset="100%" stop-color="#90b8b4"/>
        </linearGradient>
        <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="white" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="labelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="rgba(255,255,255,0.9)"/>
          <stop offset="100%" stop-color="rgba(220,245,238,0.85)"/>
        </linearGradient>
      </defs>

      <!-- Dropper tip -->
      <rect x="102" y="10" width="16" height="40" rx="8" fill="url(#dropperGrad)" opacity="0.9"/>
      <rect x="106" y="10" width="4" height="40" rx="2" fill="white" opacity="0.4"/>

      <!-- Neck collar -->
      <rect x="84" y="46" width="52" height="18" rx="5" fill="url(#capGrad)"/>
      <rect x="84" y="46" width="52" height="4" rx="2" fill="white" opacity="0.5"/>
      <line x1="84" y1="54" x2="136" y2="54" stroke="rgba(90,160,150,0.3)" stroke-width="1"/>
      <line x1="84" y1="58" x2="136" y2="58" stroke="rgba(90,160,150,0.2)" stroke-width="0.5"/>

      <!-- Bottle shoulder -->
      <path d="M 60 100 Q 58 65 84 64 L 136 64 Q 162 65 160 100 Z" fill="url(#bottleGrad)"/>

      <!-- Bottle body -->
      <rect x="58" y="98" width="104" height="360" rx="18" fill="url(#bottleGrad)"/>

      <!-- Side reflections -->
      <rect x="58" y="98" width="12" height="360" rx="6" fill="url(#shineGrad)" opacity="0.3"/>
      <rect x="150" y="98" width="12" height="360" rx="6" fill="url(#shineGrad)" opacity="0.15"/>

      <!-- Label area -->
      <rect x="70" y="130" width="80" height="260" rx="10"
            fill="url(#labelGrad)" opacity="0.95"
            stroke="rgba(90,180,160,0.15)" stroke-width="0.5"/>

      <!-- Label: brand line -->
      <text x="110" y="158" font-family="Helvetica Neue, sans-serif"
            font-size="6" font-weight="600" letter-spacing="2.5"
            fill="#5aaa8a" text-anchor="middle">DERMA LUXE</text>

      <line x1="82" y1="163" x2="138" y2="163" stroke="rgba(90,170,138,0.4)" stroke-width="0.5"/>

      <!-- Label: Product name -->
      <text x="110" y="184" font-family="Helvetica Neue, sans-serif"
            font-size="10.5" font-weight="200" letter-spacing="1.5"
            fill="#1a3d30" text-anchor="middle">ACNE RELIEF</text>
      <text x="110" y="198" font-family="Helvetica Neue, sans-serif"
            font-size="10.5" font-weight="700" letter-spacing="1.5"
            fill="#1a5c44" text-anchor="middle">SERUM</text>

      <line x1="82" y1="205" x2="138" y2="205" stroke="rgba(90,170,138,0.25)" stroke-width="0.5"/>

      <!-- Ingredient icons -->
      <ellipse cx="95" cy="230" rx="7" ry="11" fill="rgba(90,200,150,0.3)" transform="rotate(-20,95,230)"/>
      <line x1="95" y1="221" x2="95" y2="241" stroke="rgba(40,120,80,0.4)" stroke-width="0.8"/>
      <ellipse cx="110" cy="229" rx="5" ry="12" fill="rgba(144,230,180,0.35)" transform="rotate(5,110,229)"/>
      <line x1="110" y1="219" x2="110" y2="241" stroke="rgba(40,120,80,0.35)" stroke-width="0.8"/>
      <polygon points="125,220 131,224 131,232 125,236 119,232 119,224"
               fill="none" stroke="rgba(90,170,200,0.5)" stroke-width="1"/>
      <text x="125" y="231" font-family="Helvetica Neue" font-size="5"
            fill="rgba(40,100,140,0.7)" text-anchor="middle">SA</text>

      <line x1="82" y1="245" x2="138" y2="245" stroke="rgba(90,170,138,0.2)" stroke-width="0.5"/>

      <!-- Formula -->
      <text x="110" y="262" font-family="Helvetica Neue, sans-serif"
            font-size="7" font-weight="300" letter-spacing="1"
            fill="#4a8070" text-anchor="middle">2% SALICYLIC ACID</text>
      <text x="110" y="274" font-family="Helvetica Neue, sans-serif"
            font-size="7" font-weight="300" letter-spacing="1"
            fill="#4a8070" text-anchor="middle">TEA TREE  ·  ALOE VERA</text>

      <!-- Net vol -->
      <text x="110" y="350" font-family="Helvetica Neue, sans-serif"
            font-size="6.5" font-weight="300" letter-spacing="1.5"
            fill="#6a9090" text-anchor="middle">30 ML / 1.0 FL.OZ</text>

      <!-- Base -->
      <path d="M 58 458 Q 58 480 110 480 Q 162 480 162 458 Z" fill="rgba(140,200,190,0.35)"/>

      <!-- Frosted glass sheen -->
      <rect x="68" y="100" width="30" height="355" rx="8" fill="white" opacity="0.06"/>
    </svg>
  </div>

  <!-- Ingredient chips -->
  <div class="ingredient ing-tea">
    <div class="ingredient-icon">🌿</div>
    <span>Tea Tree</span>
  </div>

  <div class="ingredient ing-sal">
    <div class="ingredient-icon">⬡</div>
    <span>Salicylic Acid</span>
  </div>

  <div class="ingredient ing-aloe">
    <div class="ingredient-icon">🪴</div>
    <span>Aloe Vera</span>
  </div>

  <!-- Headline -->
  <div class="headline" id="headline">
    <h1>Acne Relief <strong>Serum</strong></h1>
    <div class="headline-rule"></div>
  </div>

  <!-- Bottom rule -->
  <div class="bottom-rule"></div>

  <!-- Benefits -->
  <div class="benefits">
    <div class="benefit" id="b1">
      <div class="benefit-num">01</div>
      <div class="benefit-text">Clears Blemishes</div>
    </div>
    <div class="benefit" id="b2">
      <div class="benefit-num">02</div>
      <div class="benefit-text">Reduces Redness</div>
    </div>
    <div class="benefit" id="b3">
      <div class="benefit-num">03</div>
      <div class="benefit-text">Unclogs Pores</div>
    </div>
  </div>

</div>
</body>
</html>

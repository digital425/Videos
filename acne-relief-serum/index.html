<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acne Relief Serum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; width: 1080px; height: 1080px; overflow: hidden; }

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500&display=swap');
  </style>
</head>
<body>

<div
  data-composition-id="acne-relief-serum"
  data-duration="6"
  data-width="1080"
  data-height="1080"
  style="width:1080px;height:1080px;position:relative;overflow:hidden;font-family:'Inter',sans-serif;"
>

  <!-- Background -->
  <div style="position:absolute;inset:0;background:linear-gradient(145deg,#f0f8ff 0%,#e8f5f0 35%,#f8fdff 65%,#e6f4f1 100%);"></div>

  <!-- Subtle grid texture -->
  <div style="position:absolute;inset:0;opacity:0.03;background-image:repeating-linear-gradient(0deg,#1a5c7a 0px,transparent 1px,transparent 40px),repeating-linear-gradient(90deg,#1a5c7a 0px,transparent 1px,transparent 40px);"></div>

  <!-- Top botanical accent bar -->
  <div class="clip" data-in="0" data-out="6" data-track-index="1"
    style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#a8d5b5,#5ba4cf,#7ec8a4,#5ba4cf,#a8d5b5);">
  </div>

  <!-- Floating botanical circles — background layer -->
  <div class="clip" data-in="0.2" data-out="6" data-track-index="2" id="circle-tl"
    style="position:absolute;top:-60px;left:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(168,213,181,0.3) 0%,transparent 70%);"></div>

  <div class="clip" data-in="0.3" data-out="6" data-track-index="2" id="circle-br"
    style="position:absolute;bottom:-80px;right:-80px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(91,164,207,0.2) 0%,transparent 70%);"></div>

  <div class="clip" data-in="0.4" data-out="6" data-track-index="2" id="circle-tr"
    style="position:absolute;top:80px;right:40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(126,200,164,0.25) 0%,transparent 70%);"></div>

  <!-- Left botanical illustration panel -->
  <div class="clip" data-in="0.5" data-out="6" data-track-index="3" id="botanicals-panel"
    style="position:absolute;left:60px;top:50%;transform:translateY(-50%);width:200px;display:flex;flex-direction:column;gap:32px;align-items:center;">

    <!-- Tea Tree leaf SVG -->
    <div id="tea-tree" style="text-align:center;">
      <svg width="80" height="90" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 85 C40 85 10 55 10 35 C10 18 23 8 40 8 C57 8 70 18 70 35 C70 55 40 85 40 85Z" fill="rgba(126,200,164,0.35)" stroke="#5ba48c" stroke-width="1.5"/>
        <path d="M40 85 L40 20" stroke="#5ba48c" stroke-width="1.5"/>
        <path d="M40 60 C30 52 18 50 18 50" stroke="#5ba48c" stroke-width="1" opacity="0.7"/>
        <path d="M40 60 C50 52 62 50 62 50" stroke="#5ba48c" stroke-width="1" opacity="0.7"/>
        <path d="M40 45 C30 37 22 36 22 36" stroke="#5ba48c" stroke-width="1" opacity="0.7"/>
        <path d="M40 45 C50 37 58 36 58 36" stroke="#5ba48c" stroke-width="1" opacity="0.7"/>
      </svg>
      <div style="font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:#5ba48c;letter-spacing:2px;text-transform:uppercase;margin-top:6px;">Tea Tree</div>
    </div>

    <!-- Aloe Vera SVG -->
    <div id="aloe" style="text-align:center;">
      <svg width="80" height="90" viewBox="0 0 80 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 85 C35 70 25 50 20 30 C17 18 24 10 32 14 C38 17 40 30 40 30 C40 30 42 17 48 14 C56 10 63 18 60 30 C55 50 45 70 40 85Z" fill="rgba(168,213,181,0.4)" stroke="#5ba48c" stroke-width="1.5"/>
        <path d="M40 85 L40 30" stroke="#5ba48c" stroke-width="1.2"/>
        <path d="M28 55 C20 48 14 45 14 45" stroke="#5ba48c" stroke-width="1" opacity="0.6"/>
        <path d="M52 55 C60 48 66 45 66 45" stroke="#5ba48c" stroke-width="1" opacity="0.6"/>
      </svg>
      <div style="font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:#5ba48c;letter-spacing:2px;text-transform:uppercase;margin-top:6px;">Aloe Vera</div>
    </div>

    <!-- Salicylic crystal SVG -->
    <div id="salicylic" style="text-align:center;">
      <svg width="80" height="70" viewBox="0 0 80 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="40,5 65,20 65,50 40,65 15,50 15,20" fill="rgba(91,164,207,0.25)" stroke="#5ba4cf" stroke-width="1.5"/>
        <polygon points="40,18 55,27 55,43 40,52 25,43 25,27" fill="rgba(91,164,207,0.15)" stroke="#5ba4cf" stroke-width="1"/>
        <line x1="40" y1="5" x2="40" y2="65" stroke="#5ba4cf" stroke-width="0.8" opacity="0.5"/>
        <line x1="15" y1="20" x2="65" y2="50" stroke="#5ba4cf" stroke-width="0.8" opacity="0.5"/>
        <line x1="65" y1="20" x2="15" y2="50" stroke="#5ba4cf" stroke-width="0.8" opacity="0.5"/>
      </svg>
      <div style="font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:#5ba4cf;letter-spacing:2px;text-transform:uppercase;margin-top:6px;">Salicylic</div>
    </div>
  </div>

  <!-- Center serum bottle -->
  <div class="clip" data-in="0.8" data-out="6" data-track-index="4" id="bottle-wrap"
    style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;">

    <svg width="180" height="400" viewBox="0 0 180 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Dropper cap -->
      <rect x="72" y="10" width="36" height="14" rx="4" fill="#d4ecf7" stroke="#5ba4cf" stroke-width="1.5"/>
      <rect x="82" y="5" width="16" height="12" rx="3" fill="#e8f5fc" stroke="#5ba4cf" stroke-width="1.2"/>
      <circle cx="90" cy="4" r="3" fill="#5ba4cf"/>

      <!-- Neck -->
      <path d="M78 24 L68 55 L112 55 L102 24Z" fill="url(#neckGrad)" stroke="#b8dff0" stroke-width="1"/>

      <!-- Main bottle body -->
      <path d="M60 55 Q55 60 54 80 L54 320 Q54 340 90 342 Q126 340 126 320 L126 80 Q125 60 120 55Z"
        fill="url(#bodyGrad)" stroke="#a8d8ea" stroke-width="1.5"/>

      <!-- Glass highlight left -->
      <path d="M66 75 Q62 100 62 180 Q62 240 65 290" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Glass highlight right subtle -->
      <path d="M114 80 Q116 130 116 200" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-linecap="round" fill="none"/>

      <!-- Label area -->
      <rect x="62" y="120" width="56" height="140" rx="4" fill="rgba(255,255,255,0.55)" stroke="rgba(91,164,207,0.3)" stroke-width="1"/>

      <!-- Label brand mark -->
      <text x="90" y="148" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="9" fill="#1a4a6b" letter-spacing="3" font-weight="300">ELEMENT</text>
      <line x1="68" y1="153" x2="112" y2="153" stroke="#5ba4cf" stroke-width="0.5" opacity="0.6"/>

      <!-- Label product name -->
      <text x="90" y="172" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="13" fill="#1a3a55" font-weight="600">Acne</text>
      <text x="90" y="187" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="13" fill="#1a3a55" font-weight="600">Relief</text>
      <text x="90" y="202" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-size="13" fill="#1a3a55" font-weight="600">Serum</text>

      <line x1="68" y1="210" x2="112" y2="210" stroke="#5ba4cf" stroke-width="0.5" opacity="0.6"/>

      <!-- Volume -->
      <text x="90" y="228" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" fill="#5ba48c" letter-spacing="1" font-weight="300">30 ML / 1 FL OZ</text>

      <!-- Bottom reflection -->
      <ellipse cx="90" cy="336" rx="32" ry="5" fill="rgba(91,164,207,0.12)"/>

      <!-- Gradients -->
      <defs>
        <linearGradient id="bodyGrad" x1="54" y1="0" x2="126" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#cceeff"/>
          <stop offset="30%" stop-color="#e8f7fd"/>
          <stop offset="60%" stop-color="#f5fbff"/>
          <stop offset="100%" stop-color="#d4ecf7"/>
        </linearGradient>
        <linearGradient id="neckGrad" x1="68" y1="0" x2="112" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#b8dff0"/>
          <stop offset="50%" stop-color="#e0f3fc"/>
          <stop offset="100%" stop-color="#b8dff0"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- Right side — main typography -->
  <div class="clip" data-in="1" data-out="6" data-track-index="5" id="text-panel"
    style="position:absolute;right:60px;top:50%;transform:translateY(-50%);width:320px;">

    <!-- Eyebrow -->
    <div id="eyebrow" style="font-family:'Inter',sans-serif;font-size:10px;font-weight:400;color:#5ba4cf;letter-spacing:4px;text-transform:uppercase;margin-bottom:16px;">
      Advanced Formula
    </div>

    <!-- Main headline -->
    <div id="headline" style="font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;line-height:1.1;color:#0d2d42;margin-bottom:8px;">
      Acne
    </div>
    <div id="headline2" style="font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:600;line-height:1.1;color:#1a5c7a;margin-bottom:8px;">
      Relief
    </div>
    <div id="headline3" style="font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;line-height:1.1;color:#0d2d42;margin-bottom:24px;">
      Serum
    </div>

    <!-- Divider -->
    <div id="divider" style="width:48px;height:1.5px;background:linear-gradient(90deg,#5ba4cf,#7ec8a4);margin-bottom:28px;"></div>

    <!-- Benefits list -->
    <div id="benefits" style="display:flex;flex-direction:column;gap:16px;margin-bottom:36px;">

      <div class="benefit-item" style="display:flex;align-items:center;gap:12px;">
        <div style="width:28px;height:28px;border-radius:50%;background:rgba(91,164,207,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7 L5.5 10.5 L12 3.5" stroke="#5ba4cf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-family:'Inter',sans-serif;font-size:14px;font-weight:400;color:#2a4a5e;letter-spacing:0.5px;">Clears Blemishes</div>
      </div>

      <div class="benefit-item" style="display:flex;align-items:center;gap:12px;">
        <div style="width:28px;height:28px;border-radius:50%;background:rgba(126,200,164,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7 L5.5 10.5 L12 3.5" stroke="#7ec8a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-family:'Inter',sans-serif;font-size:14px;font-weight:400;color:#2a4a5e;letter-spacing:0.5px;">Reduces Redness</div>
      </div>

      <div class="benefit-item" style="display:flex;align-items:center;gap:12px;">
        <div style="width:28px;height:28px;border-radius:50%;background:rgba(168,213,181,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7 L5.5 10.5 L12 3.5" stroke="#5ba48c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-family:'Inter',sans-serif;font-size:14px;font-weight:400;color:#2a4a5e;letter-spacing:0.5px;">Unclogs Pores</div>
      </div>
    </div>

    <!-- CTA tag -->
    <div id="cta-tag" style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid rgba(91,164,207,0.4);border-radius:2px;background:rgba(91,164,207,0.06);">
      <div style="font-family:'Inter',sans-serif;font-size:10px;font-weight:500;color:#1a5c7a;letter-spacing:3px;text-transform:uppercase;">Dermatologist Tested</div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div class="clip" data-in="1.5" data-out="6" data-track-index="6" id="bottom-bar"
    style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#a8d5b5,#5ba4cf,#7ec8a4,#5ba4cf,#a8d5b5);">
  </div>

  <!-- Watermark / brand footer -->
  <div class="clip" data-in="1.5" data-out="6" data-track-index="6" id="footer"
    style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:9px;font-weight:300;color:rgba(26,92,122,0.4);letter-spacing:5px;text-transform:uppercase;white-space:nowrap;">
    The Element · Clinical Skincare
  </div>

  <!-- Floating water droplets decoration -->
  <div class="clip" data-in="0.6" data-out="6" data-track-index="7" id="drop1"
    style="position:absolute;top:180px;right:420px;width:8px;height:11px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:rgba(91,164,207,0.3);transform:rotate(-15deg);">
  </div>
  <div class="clip" data-in="0.7" data-out="6" data-track-index="7" id="drop2"
    style="position:absolute;top:260px;right:440px;width:5px;height:7px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:rgba(126,200,164,0.4);transform:rotate(10deg);">
  </div>
  <div class="clip" data-in="0.65" data-out="6" data-track-index="7" id="drop3"
    style="position:absolute;bottom:340px;right:410px;width:6px;height:9px;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:rgba(91,164,207,0.25);transform:rotate(-8deg);">
  </div>

</div>

<script>
(function () {
  const tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["acne-relief-serum"] = tl;

  // Background circles float in
  tl.from("#circle-tl", { opacity: 0, scale: 0.7, duration: 1.2, ease: "power2.out" }, 0.2)
    .from("#circle-br", { opacity: 0, scale: 0.7, duration: 1.2, ease: "power2.out" }, 0.3)
    .from("#circle-tr", { opacity: 0, scale: 0.6, duration: 1, ease: "power2.out" }, 0.4)

  // Botanicals panel slides in from left
    .from("#botanicals-panel", { opacity: 0, x: -40, duration: 1, ease: "power3.out" }, 0.5)
    .from("#tea-tree", { opacity: 0, y: 20, duration: 0.8, ease: "power2.out" }, 0.7)
    .from("#aloe", { opacity: 0, y: 20, duration: 0.8, ease: "power2.out" }, 0.9)
    .from("#salicylic", { opacity: 0, y: 20, duration: 0.8, ease: "power2.out" }, 1.1)

  // Bottle rises up
    .from("#bottle-wrap", { opacity: 0, y: 50, duration: 1.4, ease: "power3.out" }, 0.8)

  // Text panel fades in staggered
    .from("#eyebrow", { opacity: 0, y: 12, duration: 0.7, ease: "power2.out" }, 1.0)
    .from("#headline", { opacity: 0, y: 18, duration: 0.6, ease: "power2.out" }, 1.15)
    .from("#headline2", { opacity: 0, y: 18, duration: 0.6, ease: "power2.out" }, 1.3)
    .from("#headline3", { opacity: 0, y: 18, duration: 0.6, ease: "power2.out" }, 1.45)
    .from("#divider", { opacity: 0, scaleX: 0, transformOrigin: "left center", duration: 0.6, ease: "power2.out" }, 1.6)
    .from(".benefit-item", { opacity: 0, x: 16, duration: 0.5, stagger: 0.15, ease: "power2.out" }, 1.75)
    .from("#cta-tag", { opacity: 0, y: 10, duration: 0.6, ease: "power2.out" }, 2.3)

  // Footer
    .from("#footer", { opacity: 0, duration: 0.8, ease: "power2.out" }, 2.5)

  // Droplets
    .from("#drop1,#drop2,#drop3", { opacity: 0, scale: 0, duration: 0.6, stagger: 0.1, ease: "back.out(1.5)" }, 1.2)

  // Gentle float on bottle after reveal
    .to("#bottle-wrap", { y: -8, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);
})();
</script>
</body>
</html>
